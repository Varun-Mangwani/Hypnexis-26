<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAGDoctor Evaluation Report</title>
<style>
body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
h1 { color: #1a1a2e; }
.score { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; margin: 2px; }
.pass { background: #d4edda; color: #155724; }
.fail { background: #f8d7da; color: #721c24; }
table { width: 100%; border-collapse: collapse; margin: 20px 0; }
th, td { border: 1px solid #dee2e6; padding: 8px 12px; text-align: left; }
th { background: #f8f9fa; }
</style>
</head>
<body>
<h1>RAGDoctor Evaluation Report</h1>
<h2>Run: run_demo_001</h2>
<h3>Aggregate Scores</h3>
<table>
<tr><th>Metric</th><th>Score</th></tr>
<tr><td>Hit@5</td><td>0.80</td></tr>
<tr><td>Recall@5</td><td>0.75</td></tr>
<tr><td>MRR</td><td>0.65</td></tr>
<tr><td>Faithfulness</td><td>0.82</td></tr>
<tr><td>Answer Accuracy</td><td>0.78</td></tr>
</table>
<h3>Verdict Distribution</h3>
<span class="score pass">PASS: 3</span>
<span class="score fail">RETRIEVAL_MISS: 1</span>
<span class="score fail">HALLUCINATION: 1</span>
</body>
</html>
